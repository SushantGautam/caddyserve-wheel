name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Caddy version to release (X.Y.Z). Defaults to build/version.txt."
        required: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin version from input (manual dispatch)
        if: inputs.version != ''
        run: |
          printf '%s' "${{ inputs.version }}" > build/version.txt
          sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ inputs.version }}\"/" src/caddyserver/__init__.py

      - name: Check version consistency
        id: ver
        run: python build/check_version.py --tag "${GITHUB_REF_NAME}"

      - name: Build wheels (downloads + verifies official Caddy release)
        run: python build/wheels.py

      - name: Verify wheels
        run: |
          python -c "
          import json, zipfile
          for m in json.load(open('build/release_manifest.json')):
              if m['file'].endswith('.whl'):
                  with zipfile.ZipFile('dist/' + m['file']) as zf:
                      assert zf.testzip() is None
                  print('ok', m['file'])
          print('all wheels valid')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 90

      - name: Release notes from manifest
        run: python build/make_notes.py

      - uses: softprops/action-gh-release@v2
        id: rel
        with:
          tag_name: "v${{ steps.ver.outputs.v }}"
          generate_release_notes: false
          body_path: build/NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Show release URL
        run: |
          echo "Release: ${{ steps.rel.outputs.url }}"

      - name: Publish to PyPI (trusted publishing / OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted publisher: pypi.org/project/caddyserver/publishing
          # repo = SushantGautam/caddyserve-wheel:*, audience = pypi
          oidc_token: ${{ github.token }}
