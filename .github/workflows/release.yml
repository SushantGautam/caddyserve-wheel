name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Caddy version to release (X.Y.Z), defaults to build/version.txt"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin version from input (manual dispatch)
        if: inputs.version != ''
        run: |
          printf '%s' "${{ inputs.version }}" > build/version.txt
          sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"${{ inputs.version }}\"/" src/caddyserver/__init__.py

      - name: Check version consistency
        id: ver
        run: |
          V=$(tr -d '[:space:]' < build/version.txt)
          grep -q "^version = \"$V\"$" pyproject.toml || { echo "FAIL: pyproject.toml version != build/version.txt ($V)"; exit 1; }
          grep -q "__version__ = \"$V\"" src/caddyserver/__init__.py || { echo "FAIL: __init__.py __version__ != build/version.txt ($V)"; exit 1; }
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "v$V" ]]; then
            echo "FAIL: tag $GITHUB_REF_NAME does not match build/version.txt ($V)"; exit 1
          fi
          echo "version $V consistent"
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Build wheels (downloads + verifies official Caddy release)
        run: python build/wheels.py

      - name: Verify wheels
        run: |
          python - <<'EOF'
          import json, zipfile
          manifest = json.load(open("dist/release_manifest.json"))
          for m in manifest:
              if m["file"].endswith(".whl"):
                  with zipfile.ZipFile(f"dist/{m['file']}") as zf:
                      assert zf.testzip() is None
                  print("ok", m["file"])
          print("all wheels valid")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 90

      - name: Release notes from manifest
        run: |
          python - <<'EOF'
          import json
          v = open("build/version.txt").read().strip()
          manifest = json.load(open("dist/release_manifest.json"))
          lines = [
              f"## caddyserver {v}",
              "",
              f"Caddy **v{v}** — official binaries, digest-verified against the upstream",
              f"[caddyserver/caddy v{v} release](https://github.com/caddyserver/caddy/releases/tag/v{v}).",
              "",
              "| File | Wheel SHA-256 | Upstream asset | Upstream digest (SHA-512) |",
              "|---|---|---|---|",
          ]
          for m in manifest:
              lines.append(
                  f"| {m['file']} | `{m['sha256']}` | {m['upstream_asset'] or '-'} | `{m['upstream_digest'] or '-'}` |"
              )
          open("dist/NOTES.md", "w").write("\n".join(lines) + "\n")
          EOF

      - uses: softprops/action-gh-release@v2
        id: rel
        with:
          tag_name: "v${{ steps.ver.outputs.v }}"
          name: "caddyserver v${{ steps.ver.outputs.v }}"
          generate_release_notes: false
          body_path: dist/NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz

      - name: Show release URL
        run: echo "Release: ${{ steps.rel.outputs.url }}"
